services:
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    ports:
      - "${DB_EXTERNAL_PORT}:${DB_INTERNAL_PORT}"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    networks:
      - app-network

  backend-api:
    build: ./backend
    container_name: java-backend
    ports:
      - "${BACKEND_EXTERNAL_PORT}:${BACKEND_INTERNAL_PORT}"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:${DB_INTERNAL_PORT}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
    networks:
      - app-network

  frontend-app:
    build: ./frontend 
    container_name: react-frontend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"
    volumes:
      - ./frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - BACKEND_HOST=backend-api
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT}
    depends_on:
      - backend-api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
